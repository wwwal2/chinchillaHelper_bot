services:
  be:
    build:
      context: ./BE
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "8080:8080"
    restart: unless-stopped

  fe:
    build:
      context: ./FE
      dockerfile: Dockerfile
    environment:
      - BE_URL=http://be:8080
    ports:
      - "80:80"
    depends_on:
      - be
    restart: unless-stopped
