server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy SSE log stream to the BE service.
    # In Docker Compose, "be" resolves to the BE container.
    location /logs {
        proxy_pass http://be:8080/logs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }

    # Proxy bot control endpoints to the BE service.
    location ~ ^/(status|pause|resume)$ {
        proxy_pass http://be:8080;
        proxy_set_header Host $host;
    }

    # SPA fallback — serve index.html for all unmatched routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
